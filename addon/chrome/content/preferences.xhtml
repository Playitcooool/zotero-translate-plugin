<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      id="zotero-prefpane-zoterotranslate" flex="1" style="padding: 10px;">

  <groupbox>
    <caption label="API Configuration"/>
    <grid>
      <columns>
        <column flex="1"/>
        <column flex="2"/>
      </columns>
      <rows>
        <row align="center">
          <label control="apiAddress" value="API Address"/>
          <textbox id="apiAddress" flex="1" placeholder="http://localhost:11434/v1"/>
        </row>
        <row align="center">
          <label control="apiKey" value="API Key"/>
          <textbox id="apiKey" flex="1" type="password" placeholder="sk-..."/>
        </row>
        <row align="center">
          <label control="modelName" value="Model"/>
          <textbox id="modelName" flex="1" placeholder="gpt-4"/>
        </row>
        <row align="center">
          <label control="targetLang" value="Target Language"/>
          <textbox id="targetLang" flex="1" placeholder="Chinese"/>
        </row>
      </rows>
    </grid>
  </groupbox>

  <groupbox>
    <caption label="Prompt Template"/>
    <description>Variables: ${text}, ${targetLang}, ${sourceLang}</description>
    <textbox id="promptTemplate" flex="1" rows="4" multiline="true"
             placeholder="Translate to ${targetLang}: ${text}"/>
  </groupbox>

  <button id="saveBtn" label="Save Settings" style="margin-top: 10px;"/>

</vbox>
