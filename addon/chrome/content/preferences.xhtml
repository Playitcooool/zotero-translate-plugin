<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      id="zotero-prefpane-zoterotranslate" flex="1" style="padding: 10px;">

  <label value="API Address"/>
  <textbox id="apiAddress" flex="1" style="min-width: 300px;"/>

  <label value="API Key" style="margin-top: 10px;"/>
  <textbox id="apiKey" type="password" flex="1" style="min-width: 300px;"/>

  <label value="Model" style="margin-top: 10px;"/>
  <textbox id="modelName" flex="1" style="min-width: 300px;"/>

  <label value="Target Language" style="margin-top: 10px;"/>
  <textbox id="targetLang" flex="1" style="min-width: 300px;"/>

  <label value="Prompt Template" style="margin-top: 10px;"/>
  <textbox id="promptTemplate" rows="4" flex="1" style="min-width: 300px;"/>

  <button id="saveBtn" label="Save Settings" style="margin-top: 10px;"/>

</vbox>
