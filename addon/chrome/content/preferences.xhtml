<?xml version="1.0" encoding="UTF-8"?>
<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="zotero-prefpane-zoterotranslate"
      onload="Zotero.ZoteroTranslate.hooks.onPrefsLoad(event)">

  <groupbox>
    <caption label="API 配置" />
    <grid>
      <columns>
        <column flex="1" />
        <column flex="2" />
      </columns>
      <rows>
        <row align="center">
          <label control="zoterotranslate-apiAddress" value="API 地址" />
          <textbox id="zoterotranslate-apiAddress"
                   preference="extensions.zotero.zoterotranslate.apiAddress"
                   placeholder="http://localhost:11434/v1" />
        </row>
        <row align="center">
          <label control="zoterotranslate-apiKey" value="API Key" />
          <textbox id="zoterotranslate-apiKey"
                   preference="extensions.zotero.zoterotranslate.apiKey"
                   type="password"
                   placeholder="sk-..." />
        </row>
        <row align="center">
          <label control="zoterotranslate-modelName" value="模型名称" />
          <textbox id="zoterotranslate-modelName"
                   preference="extensions.zotero.zoterotranslate.modelName"
                   placeholder="gpt-4" />
        </row>
        <row align="center">
          <label control="zoterotranslate-targetLang" value="目标语言" />
          <textbox id="zoterotranslate-targetLang"
                   preference="extensions.zotero.zoterotranslate.targetLang"
                   placeholder="中文" />
        </row>
      </rows>
    </grid>
  </groupbox>

  <groupbox>
    <caption label="翻译提示词" />
    <description style="margin-bottom: 8px;">
      可用变量: ${text} (原文), ${targetLang} (目标语言), ${sourceLang} (源语言)
    </description>
    <textbox id="zoterotranslate-promptTemplate"
             preference="extensions.zotero.zoterotranslate.promptTemplate"
             rows="4"
             multiline="true"
             style="width: 100%;"
             placeholder="翻译成${targetLang}：${text}" />
  </groupbox>

  <groupbox>
    <caption label="快捷键" />
    <description>打开设置窗口: Ctrl+Shift+, (Mac 上为 Cmd+Shift+,)</description>
  </groupbox>

</vbox>
