name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build add-on
        run: npm run build

      - name: Verify release asset
        run: test -f build/zotero-translate.xpi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/zotero-translate.xpi
          generate_release_notes: true
